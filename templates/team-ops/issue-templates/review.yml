name: 评审任务 (review)
description: PR 打开时自动创建、指派 CTO 的人工评审任务。关闭条件：CTO 批准。
title: "[review] "
labels: ["review"]
body:
  - type: input
    id: pr
    attributes:
      label: 待评审 PR
      description: PR 链接
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: PR 作者
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: 机器门禁状态（人工评审前应已全绿）
      options:
        - label: 四趟 AI 评审（quality/security/performance/dependency）无 BLOCK
        - label: CI 门禁（lint/类型/SAST/覆盖率/契约/bundle）通过
        - label: 涉及接口/DB 改动的文档已同步更新
  - type: textarea
    id: focus
    attributes:
      label: 评审重点
      description: 本 PR 需 CTO 重点判断的设计/取舍/风险
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: 评审结论（评审后回填）
      options:
        - 待评审
        - 批准
        - 要求修改
    validations:
      required: false
