name: 缺陷 (bug)
description: bug 修复任务。由人或自愈环 triage 创建。关闭条件：修复 PR 合并。
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: subservice
    attributes:
      label: 所属子服务
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重度
      options:
        - blocker（阻断主流程/数据损坏/安全）
        - high（核心功能不可用）
        - medium（部分功能受损）
        - low（体验问题）
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 1. … 2. … 3. …
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 日志 / 截图 / trace_id / 受影响端点与用户
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 责任人
      description: 拿不准可留空待指派
    validations:
      required: false
