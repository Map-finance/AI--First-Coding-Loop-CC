name: 每日任务 (daily-task)
description: task-splitter 拆解、人确认后建在对应代码仓的每日开发任务。关闭条件：关联 PR 合并 + 测试通过。
title: "[daily-task] "
labels: ["daily-task"]
body:
  - type: input
    id: owner
    attributes:
      label: 责任人
      description: 负责完成本任务的人（GitHub 用户名）
    validations:
      required: true
  - type: input
    id: subservice
    attributes:
      label: 所属子服务
      description: 例 svc-order / web-order，需与 ownership.md 一致
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 可测条目，用「给定…当…则…」描述，含边界/错误路径
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: 关联文档
      description: docs-repo 中相关 design.md / api.md / data-model.md 路径或链接
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: 预计工时
      description: 例 0.5d / 1d / 2d
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: 依赖项
      description: 阻塞本任务的其他 issue / 前置条件；无则填「无」
    validations:
      required: true
